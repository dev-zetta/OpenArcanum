<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>OpenArcanum Tests</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {{content-for "head"}}
    {{content-for "test-head"}}
    <link rel="stylesheet" href="/@embroider/virtual/vendor.css">
    <link rel="stylesheet" href="/@embroider/virtual/test-support.css">
    {{content-for "head-footer"}}
    {{content-for "test-head-footer"}}
  </head>
  <body>
    {{content-for "body"}}
    {{content-for "test-body"}}
    <div id="qunit"></div>
    <div id="qunit-fixture">
      <div id="ember-testing-container"><div id="ember-testing"></div></div>
    </div>
    <script src="/@embroider/virtual/vendor.js"></script>
    <script type="module">
      import '/@embroider/virtual/test-support.js';
      import { start } from './test-helper';
      const testModules = import.meta.glob('./**/*-test.ts', { eager: true });
      start(Object.keys(testModules).length);
    </script>
    {{content-for "body-footer"}}
  </body>
</html>
